[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "lastlight"
version = "0.1.4"
description = "Low-power, offline retrieval for disaster and infrastructure-failure guidance."
readme = {file = "README.md", content-type = "text/markdown"}
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [
  {name = "Eduardo J. Barrios"}
]
keywords = [
  "offline",
  "retrieval",
  "rag",
  "emergency-preparedness",
  "low-power",
]
dependencies = []
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "License :: OSI Approved :: Mozilla Public License 2.0 (MPL 2.0)",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Typing :: Typed",
  "Topic :: Scientific/Engineering :: Information Analysis",
]

[project.urls]
Homepage = "https://github.com/edujbarrios/lastlight"
Documentation = "https://github.com/edujbarrios/lastlight/blob/main/docs/python_api.md"
Repository = "https://github.com/edujbarrios/lastlight"
Issues = "https://github.com/edujbarrios/lastlight/issues"

[project.scripts]
lastlight = "lastlight.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["lastlight*"]

[tool.setuptools.package-data]
lastlight = ["py.typed", "evaluation/data/*.jsonl"]
