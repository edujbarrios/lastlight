name: quality-030

on:
  pull_request:
    paths:
      - "src/lastlight/**"
      - "tests/**"
      - ".github/workflows/quality-030.yml"

permissions:
  contents: read

jobs:
  lint-and-types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install development-only quality tools
        run: python -m pip install "ruff==0.12.12" "mypy==1.18.2"
      - name: Lint changed implementation modules
        run: |
          ruff check --select E4,E7,E9,F \
            src/lastlight/retrieval/hybrid.py \
            src/lastlight/retrieval/sections.py \
            src/lastlight/retrieval/strategies.py \
            src/lastlight/safety/calibration_v3.py \
            src/lastlight/application/app.py \
            tests/test_calibration_v3.py
      - name: Type-check new calibration and hybrid modules
        run: |
          mypy --follow-imports=silent --ignore-missing-imports \
            src/lastlight/retrieval/hybrid.py \
            src/lastlight/safety/calibration_v3.py
