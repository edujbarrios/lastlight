name: core

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Full software health check
        run: python tools/check_core.py
      - name: Core evaluation regression gate
        env:
          PYTHONPATH: src
        run: |
          python - <<'PY'
          from lastlight.application.factory import ApplicationFactory
          from lastlight.evaluation import build_evaluation_report, evaluation_gate

          app = ApplicationFactory.create("examplepack/lastlight-example-en.zip", strategy="lexical")
          report = build_evaluation_report(app)
          passed, failures = evaluation_gate(report)
          print(f"cases={report['total_cases']} top1={report['top_1_accuracy']:.3f}")
          print(report['decision_metrics'])
          if not passed:
              raise SystemExit("core evaluation gate failed: " + "; ".join(failures))
          PY
      - name: Install package from repository
        run: python -m pip install --no-deps .
      - name: Import installed library
        run: python -c "from lastlight import LastLight, QueryResult, RetrievalMetadata, SourceResult; print(LastLight.__name__)"
      - name: Installed CLI entrypoint
        run: lastlight --help

  package:
    name: package distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify release metadata
        run: python tools/check_release.py
      - name: Install build validation tooling
        run: python -m pip install --upgrade build twine
      - name: Build wheel and source distribution
        run: python -m build
      - name: Validate distribution metadata and README
        run: python -m twine check dist/*
      - name: Install built wheel in isolation
        shell: bash
        run: |
          python -m venv .package-venv
          .package-venv/bin/python -m pip install --no-deps dist/*.whl
          .package-venv/bin/python -c "from lastlight import LastLight, QueryResult; print(LastLight.__name__)"
          .package-venv/bin/python -c "from importlib.resources import files; assert files('lastlight').joinpath('py.typed').is_file(); assert files('lastlight.evaluation').joinpath('data/eval_core.jsonl').is_file()"
          .package-venv/bin/lastlight --help >/dev/null
      - name: Verify packaged evaluation gate
        shell: bash
        run: |
          .package-venv/bin/python - <<'PY'
          from lastlight.application.factory import ApplicationFactory
          from lastlight.evaluation import build_evaluation_report, evaluation_gate
          app = ApplicationFactory.create("examplepack/lastlight-example-en.zip", strategy="lexical")
          report = build_evaluation_report(app)
          passed, failures = evaluation_gate(report)
          assert report["total_cases"] > 0
          assert passed, failures
          print("packaged core evaluation: PASS")
          PY
      - name: Verify installed-library README examples
        shell: bash
        run: |
          .package-venv/bin/python - <<'PY'
          from lastlight import LastLight, __version__
          pack = "examplepack/lastlight-example-en.zip"
          bleeding = "Someone has a deep cut and is bleeding heavily. What should I do while waiting for emergency services?"
          food = "The power has been out for several hours. How long will food stay safe in my refrigerator if I keep the door closed?"
          assert __version__ == "0.1.3"
          practical = LastLight(pack, strategy="lexical").query(bleeding)
          assert practical.accepted and practical.confidence == "HIGH"
          assert practical.sources[0].title == "Severe external bleeding"
          assert practical.sources[0].path == "en/first-aid/severe-bleeding.md"
          lexical = LastLight(pack, strategy="lexical").query(food)
          assert lexical.accepted and lexical.sources[0].title == "Food safety during a power outage"
          bm25 = LastLight(pack, strategy="bm25").query(food)
          assert bm25.accepted and bm25.sources[0].title == "Food safety during a power outage"
          refusal = LastLight(pack).query("How do I repair a diesel engine that will not start?")
          assert refusal.accepted is False and refusal.sources == ()
          print("installed-library README examples: PASS")
          PY
