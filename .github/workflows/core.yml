name: core

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Full software health check
        run: python tools/check_core.py
      - name: Install package from repository
        run: python -m pip install --no-deps .
      - name: Import installed library
        run: python -c "from lastlight import LastLight, QueryResult, RetrievalMetadata, SourceResult; print(LastLight.__name__)"
      - name: Installed CLI entrypoint
        run: lastlight --help

  package:
    name: package distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify release metadata
        run: python tools/check_release.py
      - name: Install build validation tooling
        run: python -m pip install --upgrade build twine
      - name: Build wheel and source distribution
        run: python -m build
      - name: Validate distribution metadata and README
        run: python -m twine check dist/*
      - name: Install built wheel in isolation
        shell: bash
        run: |
          python -m venv .package-venv
          .package-venv/bin/python -m pip install --no-deps dist/*.whl
          .package-venv/bin/python -c "from lastlight import LastLight, QueryResult; print(LastLight.__name__)"
          .package-venv/bin/python -c "from importlib.resources import files; assert files('lastlight').joinpath('py.typed').is_file()"
          .package-venv/bin/lastlight --help >/dev/null
      - name: Verify installed-library README examples
        shell: bash
        run: |
          .package-venv/bin/python - <<'PY'
          from lastlight import LastLight, __version__

          pack = "examplepack/lastlight-example-en.zip"
          bleeding = (
              "Someone has a deep cut and is bleeding heavily. "
              "What should I do while waiting for emergency services?"
          )
          food = (
              "The power has been out for several hours. "
              "How long will food stay safe in my refrigerator if I keep the door closed?"
          )

          assert __version__ == "0.1.2"

          practical = LastLight(pack, strategy="lexical").query(bleeding)
          assert practical.accepted is True
          assert practical.confidence == "HIGH"
          assert practical.sources[0].title == "Severe external bleeding"
          assert round(practical.sources[0].score, 3) == 2.748
          assert "direct pressure" in practical.passage

          lexical = LastLight(pack, strategy="lexical").query(food)
          assert lexical.accepted is True
          assert lexical.confidence == "HIGH"
          assert lexical.sources[0].title == "Food safety during a power outage"
          assert round(lexical.sources[0].score, 3) == 4.918
          assert "about 4 hours" in lexical.passage

          bm25 = LastLight(pack, strategy="bm25").query(food)
          assert bm25.accepted is True
          assert bm25.confidence == "HIGH"
          assert bm25.sources[0].title == "Food safety during a power outage"
          assert round(bm25.sources[0].score, 3) == 11.475

          survival = LastLight(pack, strategy="adaptive", mode="survival").plan(food)
          assert survival.strategy == "lexical"
          assert survival.risk == "normal"
          assert survival.effective_top_k == 2

          balanced = LastLight(pack, strategy="adaptive", mode="balanced").plan(food)
          assert balanced.strategy == "bm25"
          assert balanced.risk == "normal"
          assert balanced.effective_top_k == 3

          accuracy = LastLight(pack, strategy="adaptive", mode="accuracy").plan(food)
          assert accuracy.strategy == "bm25"
          assert accuracy.risk == "normal"
          assert accuracy.effective_top_k == 3

          constrained = LastLight(
              pack,
              strategy="adaptive",
              mode="balanced",
              energy_budget_mwh=0.4,
          ).plan(food)
          assert constrained.strategy == "lexical"
          assert constrained.effective_top_k == 2

          refusal = LastLight(pack).query("How do I repair a diesel engine that will not start?")
          assert refusal.accepted is False
          assert refusal.confidence is None
          assert refusal.passage is None
          assert refusal.sources == ()
          assert refusal.refusal_reason == "no_matching_knowledge"

          print("installed-library README examples: PASS")
          PY
