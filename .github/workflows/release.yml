name: publish-to-pypi

on:
  release:
    types: [published]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build release distributions
    if: github.event_name == 'release' || contains(github.event.head_commit.message, '[bootstrap-pypi-v0.1.3]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Verify release metadata and tag
        env:
          RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || 'v0.1.3' }}
        run: python tools/check_release.py --tag "$RELEASE_TAG"
      - name: Install release tooling
        run: python -m pip install --upgrade build twine
      - name: Build wheel and source distribution
        run: python -m build
      - name: Validate distribution metadata
        run: python -m twine check dist/*
      - name: Install built wheel in a clean environment
        shell: bash
        run: |
          python -m venv .release-venv
          .release-venv/bin/python -m pip install --no-deps dist/*.whl
          .release-venv/bin/python -c "from importlib.resources import files; from lastlight import LastLight, QueryResult, __version__; assert __version__ == '0.1.3'; assert files('lastlight').joinpath('py.typed').is_file(); assert files('lastlight.evaluation').joinpath('data/eval_core.jsonl').is_file(); print(LastLight.__name__, __version__)"
          .release-venv/bin/lastlight --help >/dev/null
      - name: Store release distributions
        uses: actions/upload-artifact@v5
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error

  bootstrap-release:
    name: Create GitHub v0.1.3 release
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[bootstrap-pypi-v0.1.3]')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create v0.1.3 release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create v0.1.3 \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "LastLight v0.1.3" \
            --notes-file - <<'EOF'
          Core-hardening release for the LastLight Python library.

          Highlights:
          - packaged core evaluation suite with answerable and expected-refusal cases
          - CI regression gates for retrieval and refusal quality
          - LastLight Knowledge Pack Format v1 (`format_version: 1`)
          - canonical pack-relative document paths and stable directory/ZIP fingerprint inputs
          - safer ZIP loading with traversal, duplicate-member and size protections
          - malformed pack reads exposed through the public `PackError` hierarchy
          - no new runtime dependencies; the runtime remains Python stdlib-only
          EOF

  publish:
    name: Publish release to PyPI
    needs: [build, bootstrap-release]
    if: always() && needs.build.result == 'success' && (github.event_name == 'release' || needs.bootstrap-release.result == 'success')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/lastlight
    permissions:
      id-token: write
    steps:
      - name: Download release distributions
        uses: actions/download-artifact@v6
        with:
          name: python-package-distributions
          path: dist/
      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
