name: publish-to-pypi

on:
  push:
    branches: [publish/0.2.0]
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    name: Build release distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Verify release metadata and tag
        env:
          RELEASE_TAG: v0.2.0
        run: python tools/check_release.py --tag "$RELEASE_TAG"
      - name: Install release tooling
        run: python -m pip install --upgrade build twine
      - name: Build wheel and source distribution
        run: python -m build
      - name: Validate distribution metadata
        run: python -m twine check dist/*
      - name: Install built wheel in a clean environment
        shell: bash
        run: |
          python -m venv .release-venv
          .release-venv/bin/python -m pip install --no-deps dist/*.whl
          .release-venv/bin/python -c "from importlib.resources import files; from lastlight import DecisionMetadata, LastLight, QueryExplanation, QueryResult, __version__; assert __version__ == '0.2.0'; assert files('lastlight').joinpath('py.typed').is_file(); assert files('lastlight.evaluation').joinpath('data/eval_core.jsonl').is_file(); print(LastLight.__name__, __version__)"
          .release-venv/bin/lastlight --help >/dev/null
      - name: Store release distributions
        uses: actions/upload-artifact@v5
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish release to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/lastlight
    permissions:
      id-token: write
    steps:
      - name: Download release distributions
        uses: actions/download-artifact@v6
        with:
          name: python-package-distributions
          path: dist/
      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    name: Publish GitHub release
    needs: publish
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.2.0 \
            --target 8979407511f724034804d473bd853ac8b87a6ff2 \
            --title "LastLight v0.2.0" \
            --notes-file docs/releases/0.2.0.md
