name: publish-to-pypi

on:
  release:
    types: [published]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build release distributions
    if: github.event_name == 'release' || contains(github.event.head_commit.message, '[bootstrap-pypi-v0.1.2]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Verify release metadata and tag
        env:
          RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || 'v0.1.2' }}
        run: python tools/check_release.py --tag "$RELEASE_TAG"
      - name: Install release tooling
        run: python -m pip install --upgrade build twine
      - name: Build wheel and source distribution
        run: python -m build
      - name: Validate distribution metadata
        run: python -m twine check dist/*
      - name: Install built wheel in a clean environment
        shell: bash
        run: |
          python -m venv .release-venv
          .release-venv/bin/python -m pip install --no-deps dist/*.whl
          .release-venv/bin/python -c "from importlib.resources import files; from lastlight import LastLight, QueryResult, __version__; assert __version__ == '0.1.2'; assert files('lastlight').joinpath('py.typed').is_file(); print(LastLight.__name__, __version__)"
          .release-venv/bin/lastlight --help >/dev/null
      - name: Store release distributions
        uses: actions/upload-artifact@v5
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error

  bootstrap-release:
    name: Create GitHub v0.1.2 release and clean merged branches
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[bootstrap-pypi-v0.1.2]')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Delete merged PR branches
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for branch in \
            api/harden-public-boundary \
            api/public-pack-management \
            api/richer-result-metadata \
            retrieval/prune-weak-low-confidence \
            typing/typed-public-package \
            release/bootstrap-v0.1.2
          do
            echo "Deleting merged branch: $branch"
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$branch"
          done
      - name: Create v0.1.2 release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create v0.1.2 \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "LastLight v0.1.2" \
            --notes-file - <<'EOF'
          Library-hardening release built from PRs #45 through #49.

          Highlights:
          - stable public search-result contracts and explicit configuration errors
          - public knowledge-pack inspection, validation and provenance APIs
          - machine-readable refusal reasons and richer adaptive resource metadata
          - cleaner out-of-domain retrieval by pruning generic LOW-confidence matches
          - PEP 561 typed-package support with public Literal contracts
          - CI coverage across Python 3.10, 3.11 and 3.12
          - no runtime dependency additions
          EOF

  publish:
    name: Publish release to PyPI
    needs: [build, bootstrap-release]
    if: always() && needs.build.result == 'success' && (github.event_name == 'release' || needs.bootstrap-release.result == 'success')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/lastlight
    permissions:
      id-token: write
    steps:
      - name: Download release distributions
        uses: actions/download-artifact@v6
        with:
          name: python-package-distributions
          path: dist/
      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
